[build]
  functions = "netlify/functions"
  publish = "."

# Astro's fingerprinted CSS and JS. Must be proxied too, or /food/ pages
# load their markup from the content site and their stylesheet from the PWA,
# which doesn't have one.
[[redirects]]
  from = "/_astro/*"
  to = "https://ayurveda-content.netlify.app/_astro/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/food/*"
  to = "https://ayurveda-content.netlify.app/food/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://ayurveda-content.netlify.app/sitemap.xml"
  status = 200
  force = true
